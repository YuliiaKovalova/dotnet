# Simulation workflow: demonstrates the build failure analysis pipeline
# in a GitHub Actions environment, mimicking what the AzDO pipeline would do.
#
# This creates a small .NET project with a deliberate build error,
# generates a binlog, then runs the full analysis pipeline and posts
# a PR comment with the results.

name: "🧪 Build Failure Analysis Simulation"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [feature/build-failure-analysis]

permissions:
  contents: read

env:
  BINLOG_MCP_VERSION: '1.0.0-preview.26268.3'

concurrency:
  group: bfa-simulation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  simulate-insertion-failure:
    # Only run on non-fork PRs (needs secrets)
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write
      models: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Step 1: Create a deliberately broken .NET project ──────────
      # The project must live INSIDE the repo so errors reference files
      # in the PR diff, enabling inline suggestions.
      - name: Create broken .NET project
        run: |
          mkdir -p eng/build-failure-analysis/simulation-test
          cat > eng/build-failure-analysis/simulation-test/broken.csproj << 'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net9.0</TargetFramework>
              <Nullable>enable</Nullable>
            </PropertyGroup>
          </Project>
          EOF

      - name: Build with binary log (expect failure)
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          dotnet build eng/build-failure-analysis/simulation-test/broken.csproj \
            --binaryLog:/tmp/broken-project/build.binlog 2>&1 | tee /tmp/build-output.log || true
          echo "Build exited (expected failure)"

      - name: Verify build failed
        run: |
          if [ -f /tmp/broken-project/build.binlog ]; then
            echo "✅ Binlog generated: $(ls -lh /tmp/broken-project/build.binlog | awk '{print $5}')"
          else
            echo "⚠️ No binlog generated, will use log fallback"
          fi

      # ── Step 2: Install binlog-mcp ─────────────────────────────────
      - name: Install binlog-mcp
        run: |
          mkdir -p /tmp/binlog-tool
          cat > /tmp/binlog-tool/nuget.config << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="dotnet-eng" value="https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-eng/nuget/v3/index.json" />
            </packageSources>
          </configuration>
          EOF
          dotnet tool install --global AITools.BinlogMcp \
            --configfile /tmp/binlog-tool/nuget.config \
            --version "$BINLOG_MCP_VERSION"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # ── Step 3: Setup Node.js ──────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install analysis scripts
        run: cd eng/build-failure-analysis/scripts && npm ci --ignore-scripts

      # ── Step 4: Run unit tests ─────────────────────────────────────
      - name: Run unit tests
        run: |
          cd eng/build-failure-analysis/scripts
          node test-utils.js

      # ── Step 5: Extract errors from binlog ─────────────────────────
      - name: Extract errors via binlog-mcp
        id: extract-mcp
        continue-on-error: true
        run: |
          cd eng/build-failure-analysis/scripts
          BINLOG="/tmp/broken-project/build.binlog"
          if [ -f "$BINLOG" ]; then
            echo "[]" > /tmp/combined-errors.json
            if timeout 120 node extract-binlog-errors.js "$BINLOG" > /tmp/current-binlog.json 2>/tmp/extract-err.log; then
              node merge-errors.js /tmp/combined-errors.json /tmp/current-binlog.json /tmp/combined-errors.json
              node -e "
                const fs = require('fs');
                const data = JSON.parse(fs.readFileSync('/tmp/current-binlog.json','utf8'));
                const errors = fs.readFileSync('/tmp/combined-errors.json','utf8');
                fs.writeFileSync('/tmp/binlog-analysis.json', JSON.stringify({
                  overview: data.overview || 'Simulated insertion failure',
                  errors: errors,
                  warnings: data.warnings || 'N/A'
                }, null, 2));
                const parsed = JSON.parse(errors);
                console.log('Extracted ' + parsed.length + ' errors');
              "
              echo "extracted=true" >> "$GITHUB_OUTPUT"
            else
              echo "extracted=false" >> "$GITHUB_OUTPUT"
              echo "::warning::binlog-mcp extraction failed"
              cat /tmp/extract-err.log 2>/dev/null || true
            fi
          else
            echo "extracted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract errors from build log (fallback)
        if: steps.extract-mcp.outputs.extracted != 'true'
        id: extract-fallback
        run: |
          node -e "
            const fs = require('fs');
            const lines = fs.readFileSync('/tmp/build-output.log', 'utf8').split('\n');
            const errors = lines.filter(l => /: error /i.test(l))
              .map(l => l.trim()).filter((v,i,a) => a.indexOf(v)===i).slice(0,30)
              .map(l => {
                const m = l.match(/^(.+)\((\d+),(\d+)\):\s*error\s+(\w+):\s*(.+?)(?:\s*\[(.+)\])?\$/);
                return m ? {severity:'error',code:m[4],message:m[5].trim(),file:m[1],line:+m[2],column:+m[3]} : {severity:'error',message:l};
              });
            fs.writeFileSync('/tmp/binlog-analysis.json', JSON.stringify({
              overview: 'Build failed. Errors extracted from build output (simulation).',
              errors: JSON.stringify(errors),
              warnings: 'N/A'
            }, null, 2));
            console.log('Fallback: extracted ' + errors.length + ' errors');
          "
          echo "extracted=true" >> "$GITHUB_OUTPUT"

      # ── Step 6: AI Analysis ────────────────────────────────────────
      - name: Analyze errors with AI
        if: steps.extract-mcp.outputs.extracted == 'true' || steps.extract-fallback.outputs.extracted == 'true'
        continue-on-error: true
        env:
          BINLOG_DATA: /tmp/binlog-analysis.json
          GITHUB_WORKSPACE_PATH: ${{ github.workspace }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: node eng/build-failure-analysis/scripts/analyze-errors.js

      # ── Step 7: Post PR comment ────────────────────────────────────
      - name: Post analysis comment
        if: steps.extract-mcp.outputs.extracted == 'true' || steps.extract-fallback.outputs.extracted == 'true'
        continue-on-error: true
        env:
          ANALYSIS_FILE: /tmp/analysis-result.md
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: node eng/build-failure-analysis/scripts/post-pr-comment.js

      # ── Step 8: Post inline fix suggestions ─────────────────────────
      - name: Post inline fix suggestions
        if: steps.extract-mcp.outputs.extracted == 'true' || steps.extract-fallback.outputs.extracted == 'true'
        continue-on-error: true
        env:
          BINLOG_DATA: /tmp/binlog-analysis.json
          GITHUB_WORKSPACE_PATH: ${{ github.workspace }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: node eng/build-failure-analysis/scripts/post-suggestions-azdo.js

      # ── Step 9: Show output for debugging ──────────────────────────
      - name: Show analysis result
        if: always()
        run: |
          echo "=== Extracted errors ==="
          if [ -f /tmp/binlog-analysis.json ]; then
            cat /tmp/binlog-analysis.json | head -100
          else
            echo "No extraction output"
          fi
          echo ""
          echo "=== Analysis result ==="
          if [ -f /tmp/analysis-result.md ]; then
            cat /tmp/analysis-result.md
          else
            echo "No analysis output"
          fi
