name: "🧪 Test Binlog Analysis (Download from AzDO)"

on:
  workflow_dispatch:
    inputs:
      azdo-build-id:
        description: "AzDO build ID to download binlogs from"
        required: true
        type: string
      artifact-name:
        description: "Specific artifact name (leave empty for auto-detect failed leg)"
        required: false
        type: string
      pr-number:
        description: "GitHub PR number to post comment to"
        required: false
        type: string
        default: "1"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  test-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BINLOG_MCP_VERSION: '1.0.0-preview.26268.3'
    steps:
      - uses: actions/checkout@v4

      - name: Download binlogs from Azure DevOps
        id: download
        run: |
          set -uo pipefail
          BUILD_ID="${{ inputs.azdo-build-id }}"
          echo "Downloading from AzDO build $BUILD_ID"
          mkdir -p /tmp/azdo-artifacts

          ARTIFACTS=$(curl -sf \
            "https://dev.azure.com/dnceng-public/public/_apis/build/builds/${BUILD_ID}/artifacts?api-version=7.1")

          SPECIFIC="${{ inputs.artifact-name }}"
          if [ -n "$SPECIFIC" ]; then
            ARTIFACT_NAME="$SPECIFIC"
          else
            # Auto-detect: find failed jobs, pick their BuildLogs artifact
            TIMELINE=$(curl -sf \
              "https://dev.azure.com/dnceng-public/public/_apis/build/builds/${BUILD_ID}/timeline?api-version=7.1")
            FAILED_JOB=$(echo "$TIMELINE" | jq -r '[.records[] | select(.type=="Job" and .result=="failed")] | .[0].name // empty')
            if [ -n "$FAILED_JOB" ]; then
              ARTIFACT_NAME=$(echo "$ARTIFACTS" | jq -r --arg job "$FAILED_JOB" \
                '[.value[] | select(.name | test("BuildLogs"; "i")) | select(.name | test($job; "i"))] | .[0].name // empty')
            fi
            if [ -z "$ARTIFACT_NAME" ]; then
              ARTIFACT_NAME=$(echo "$ARTIFACTS" | jq -r \
                '[.value[] | select(.name | test("BuildLogs"; "i"))] | sort_by(.resource.properties.artifactsize) | .[0].name // empty')
            fi
          fi

          if [ -z "$ARTIFACT_NAME" ] || [ "$ARTIFACT_NAME" = "null" ]; then
            echo "No BuildLogs artifacts found"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Downloading: $ARTIFACT_NAME"
          curl -sfL -o /tmp/azdo-artifacts/logs.zip \
            "https://dev.azure.com/dnceng-public/public/_apis/build/builds/${BUILD_ID}/artifacts?artifactName=${ARTIFACT_NAME}&api-version=7.1&%24format=zip"

          echo "Extracting..."
          unzip -qo /tmp/azdo-artifacts/logs.zip -d /tmp/azdo-artifacts/ 2>/dev/null || true

          # List all binlogs
          echo "All binlogs found:"
          find /tmp/azdo-artifacts -name '*.binlog' -type f 2>/dev/null | while read f; do echo "  $(du -h "$f" | cut -f1) $f"; done

          # Pick the top-level VMR orchestration binlog (no repo subdir between Release/ and Build.binlog)
          BINLOG=$(find /tmp/azdo-artifacts -path '*/artifacts/log/Release/Build.binlog' -not -path '*/Release/*/Build.binlog' -type f 2>/dev/null | head -1)

          # Fallback: largest binlog
          if [ -z "$BINLOG" ]; then
            echo "No top-level binlog found, falling back to largest"
            BINLOG=$(find /tmp/azdo-artifacts -name '*.binlog' -type f -printf '%s %p\n' 2>/dev/null \
              | sort -rn | head -1 | cut -d' ' -f2-)
          fi

          echo "Selected: $BINLOG"

          if [ -n "$BINLOG" ] && [ -f "$BINLOG" ]; then
            echo "Binlog size: $(du -h "$BINLOG" | cut -f1)"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "path=$BINLOG" >> "$GITHUB_OUTPUT"
          else
            echo "No .binlog files found"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install binlog-mcp
        if: steps.download.outputs.found == 'true'
        run: |
          dotnet tool install --global AITools.BinlogMcp \
            --add-source "https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-tools/nuget/v3/index.json" \
            --version "$BINLOG_MCP_VERSION"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Dump binlog as JSON (C#)
        if: steps.download.outputs.found == 'true'
        run: |
          mkdir -p /tmp/binlog-data
          timeout 120 dotnet run --project .github/workflows/scripts/DumpBinlog -- \
            "${{ steps.download.outputs.path }}" \
            /tmp/binlog-data

      - name: Show results
        if: always()
        run: |
          echo "=== Overview ==="
          cat /tmp/binlog-data/binlog-overview.json 2>/dev/null | head -30 || echo "No overview"
          echo ""
          echo "=== Errors ==="
          cat /tmp/binlog-data/binlog-errors.json 2>/dev/null | head -50 || echo "No errors"
          echo ""
          echo "=== Warnings ==="
          cat /tmp/binlog-data/binlog-warnings.json 2>/dev/null | head -20 || echo "No warnings"

      - name: Post analysis to PR
        if: steps.download.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prNumber = parseInt('${{ inputs.pr-number }}');
            if (!prNumber) { core.info('No PR number, skipping comment'); return; }

            let overview = '', errors = '', warnings = '';
            try { overview = fs.readFileSync('/tmp/binlog-data/binlog-overview.json', 'utf8'); } catch {}
            try { errors = fs.readFileSync('/tmp/binlog-data/binlog-errors.json', 'utf8'); } catch {}
            try { warnings = fs.readFileSync('/tmp/binlog-data/binlog-warnings.json', 'utf8'); } catch {}

            let parsedErrors = [];
            try { parsedErrors = JSON.parse(errors); } catch {}
            if (typeof parsedErrors === 'string') {
              try { parsedErrors = JSON.parse(parsedErrors); } catch {}
            }
            if (!Array.isArray(parsedErrors)) parsedErrors = [];

            let errorTable = '';
            if (parsedErrors.length > 0) {
              const rows = parsedErrors.slice(0, 30).map(e =>
                `| \`${e.code || '—'}\` | ${e.file ? e.file.split('/').slice(-2).join('/') : '—'}:${e.line || ''} | ${(e.message || '').substring(0, 120)} |`
              ).join('\n');
              errorTable = `| Code | File | Message |\n| ---- | ---- | ------- |\n${rows}`;
            }

            const buildId = '${{ inputs.azdo-build-id }}';
            const azdoUrl = `https://dev.azure.com/dnceng-public/public/_build/results?buildId=${buildId}`;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            const marker = '<!-- binlog-failure-analysis -->';
            const body = [
              marker,
              '## 🔍 Build Failure Analysis',
              '',
              '### 📊 Build Overview',
              '```',
              typeof overview === 'string' ? overview.replace(/\\n/g, '\n').replace(/^"|"$/g, '') : JSON.stringify(overview, null, 2),
              '```',
              '',
              parsedErrors.length > 0 ? `### ❌ Errors (${parsedErrors.length})` : '### ✅ No MSBuild errors in this build leg',
              '',
              errorTable || '_No MSBuild compilation errors captured. The build failure may be in tests or post-build validation — check the [AzDO build](' + azdoUrl + ') for details._',
              '',
              '---',
              `<sub>🤖 Generated from [AzDO build ${buildId}](${azdoUrl}) · [workflow run](${runUrl})</sub>`,
            ].join('\n');

            const allComments = await github.paginate(
              github.rest.issues.listComments,
              { owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, per_page: 100 },
            );
            const existing = allComments.filter(c => c.body.includes(marker));
            const latest = existing[existing.length - 1];

            if (latest) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: latest.id, body,
              });
              for (const old of existing.slice(0, -1)) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner, repo: context.repo.repo, comment_id: old.id,
                });
              }
              core.info(`Updated comment on PR #${prNumber}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: prNumber, body,
              });
              core.info(`Posted comment on PR #${prNumber}`);
            }
